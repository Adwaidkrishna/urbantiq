<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | URBANTIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/product.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top navbar-glass">
        <div class="container-fluid px-4 px-lg-5">
            <a class="navbar-brand" href="/">URBANTIQ</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/product">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/register">Signup</a></li>
                </ul>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div class="search-container d-none d-lg-flex">
                    <i class="bi bi-search text-muted me-2"></i>
                    <input type="text" class="search-input" placeholder="Search products...">
                </div>
                <a href="/wishlist" class="icon-btn" title="Wishlist">
                    <i class="bi bi-heart"></i>
                    <span class="wishlist-badge">0</span>
                </a>
                <a href="/cart" class="icon-btn" title="Cart">
                    <i class="bi bi-cart3"></i>
                    <span class="cart-badge">0</span>
                </a>
                <a href="/account" class="icon-btn" title="Profile"><i class="bi bi-person"></i></a>
                <button class="navbar-toggler border-0 p-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Shop Layout -->
    <div class="shop-wrapper container-fluid px-4 px-lg-5">

        <!-- Breadcrumb + Title Row -->
        <div class="shop-title-row">
            <div>
                <div class="breadcrumb-custom">
                    <a href="/">Home</a>
                    <i class="bi bi-chevron-right"></i>
                    <span class="active">All Products</span>
                </div>
                <h1 class="collections-title">Collections</h1>
            </div>
            <div class="sort-row">
                <span class="sort-label">Sort:</span>
                <select class="sort-select" id="sortSelect">
                    <option>Most Popular</option>
                    <option>Newest First</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                    <option>Top Rated</option>
                </select>
            </div>
        </div>

        <!-- Content Row: Sidebar + Grid -->
        <div class="shop-content-row">

            <!-- ====== FILTER SIDEBAR ====== -->
            <aside class="filter-sidebar" id="filterSidebar">
                <!-- Sidebar Header -->
                <div class="filter-sidebar-header d-flex justify-content-between align-items-center mb-3">
                    <h2 class="filter-sidebar-title m-0">Filters</h2>
                    <button type="button" class="filter-clear-link" id="clearFiltersLink">Clear All</button>
                </div>

                <div class="filter-sections-scroll">
                    <!-- Categories -->
                    <div class="filter-section">
                        <div class="filter-label">Categories</div>
                        <ul class="filter-list" id="categoryFilterList"></ul>
                    </div>

                    <!-- Price Range -->
                    <div class="filter-section">
                        <div class="filter-label">Price Range</div>
                        <div class="price-slider-wrap">
                            <div class="price-slider-container">
                                <div class="slider-track" id="sliderTrack"></div>
                                <input type="range" class="price-slider min-price-input" id="priceSliderMin" min="0" max="5000" value="0" step="100">
                                <input type="range" class="price-slider max-price-input" id="priceSliderMax" min="0" max="5000" value="5000" step="100">
                            </div>
                            <div class="price-range-labels mt-2">
                                <span id="priceDisplay">₹0 – ₹5,000</span>
                            </div>
                        </div>
                    </div>

                    <!-- Sizes -->
                    <div class="filter-section">
                        <div class="filter-label">Size</div>
                        <div class="size-pills" id="sizeFilterList">
                            <button type="button" class="size-pill" value="S">S</button>
                            <button type="button" class="size-pill" value="M">M</button>
                            <button type="button" class="size-pill" value="L">L</button>
                            <button type="button" class="size-pill" value="XL">XL</button>
                            <button type="button" class="size-pill" value="XXL">XXL</button>
                        </div>
                    </div>

                    <!-- Colors -->
                    <div class="filter-section">
                        <div class="filter-label">Color</div>
                        <div class="color-swatches" id="colorFilterList">
                            <button type="button" class="color-swatch swatch-black" style="background-color: #000;" value="Black" title="Black"></button>
                            <button type="button" class="color-swatch swatch-white" style="background-color: #fff; border: 1px solid #e5e5e7;" value="White" title="White"></button>
                            <button type="button" class="color-swatch swatch-blue" style="background-color: #007aff;" value="Blue" title="Blue"></button>
                            <button type="button" class="color-swatch swatch-red" style="background-color: #ff3b30;" value="Red" title="Red"></button>
                            <button type="button" class="color-swatch swatch-green" style="background-color: #34c759;" value="Green" title="Green"></button>
                            <button type="button" class="color-swatch swatch-brown" style="background-color: #a2845e;" value="Brown" title="Brown"></button>
                        </div>
                    </div>

                    <!-- Availability -->
                    <div class="filter-section">
                        <div class="filter-label">Availability</div>
                        <ul class="filter-list" id="availabilityFilterList">
                            <li>
                                <label class="filter-check">
                                    <input type="radio" name="availabilityFilter" value="all" checked>
                                    <span class="checkmark"></span>
                                    All Products
                                </label>
                            </li>
                            <li>
                                <label class="filter-check">
                                    <input type="radio" name="availabilityFilter" value="inStock">
                                    <span class="checkmark"></span>
                                    In Stock
                                </label>
                            </li>
                            <li>
                                <label class="filter-check">
                                    <input type="radio" name="availabilityFilter" value="outOfStock">
                                    <span class="checkmark"></span>
                                    Out of Stock
                                </label>
                            </li>
                        </ul>
                    </div>

                    <!-- Customer Ratings -->
                    <div class="filter-section">
                        <div class="filter-label">Customer Ratings</div>
                        <ul class="filter-list" id="ratingFilterList">
                            <li>
                                <label class="filter-check">
                                    <input type="radio" name="ratingFilter" value="4">
                                    <span class="checkmark"></span>
                                    <span class="d-flex align-items-center gap-1 text-warning">
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star text-muted"></i>
                                        <span class="ms-1 text-secondary" style="font-size: 0.8rem;">&amp; Up</span>
                                    </span>
                                </label>
                            </li>
                            <li>
                                <label class="filter-check">
                                    <input type="radio" name="ratingFilter" value="3">
                                    <span class="checkmark"></span>
                                    <span class="d-flex align-items-center gap-1 text-warning">
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star text-muted"></i>
                                        <i class="bi bi-star text-muted"></i>
                                        <span class="ms-1 text-secondary" style="font-size: 0.8rem;">&amp; Up</span>
                                    </span>
                                </label>
                            </li>
                            <li>
                                <label class="filter-check">
                                    <input type="radio" name="ratingFilter" value="2">
                                    <span class="checkmark"></span>
                                    <span class="d-flex align-items-center gap-1 text-warning">
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star text-muted"></i>
                                        <i class="bi bi-star text-muted"></i>
                                        <i class="bi bi-star text-muted"></i>
                                        <span class="ms-1 text-secondary" style="font-size: 0.8rem;">&amp; Up</span>
                                    </span>
                                </label>
                            </li>
                        </ul>
                    </div>

                    <!-- Collections -->
                    <div class="filter-section">
                        <div class="filter-label">Collections</div>
                        <ul class="filter-list" id="collectionFilterList">
                            <li>
                                <label class="filter-check">
                                    <input type="checkbox" id="filterNewArrival" value="new">
                                    <span class="checkmark"></span>
                                    New Arrivals
                                </label>
                            </li>
                            <li>
                                <label class="filter-check">
                                    <input type="checkbox" id="filterBestSeller" value="best">
                                    <span class="checkmark"></span>
                                    Best Sellers
                                </label>
                            </li>
                        </ul>
                    </div>

                    <!-- Discount -->
                    <div class="filter-section">
                        <div class="filter-label">Discount</div>
                        <ul class="filter-list" id="discountFilterList">
                            <li>
                                <label class="filter-check">
                                    <input type="radio" name="discountFilter" value="10">
                                    <span class="checkmark"></span>
                                    10% Off &amp; Above
                                </label>
                            </li>
                            <li>
                                <label class="filter-check">
                                    <input type="radio" name="discountFilter" value="25">
                                    <span class="checkmark"></span>
                                    25% Off &amp; Above
                                </label>
                            </li>
                            <li>
                                <label class="filter-check">
                                    <input type="radio" name="discountFilter" value="50">
                                    <span class="checkmark"></span>
                                    50% Off &amp; Above
                                </label>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Sticky bottom panel inside sidebar for mobile/apply controls -->
                <div class="filter-sidebar-footer">
                    <button type="button" class="btn-clear-sidebar" id="btnSidebarClear">Clear All</button>
                    <button type="button" class="btn-apply-sidebar" id="btnSidebarApply">Apply</button>
                </div>
            </aside>

            <!-- ====== PRODUCT GRID ====== -->
            <div class="product-grid-wrap">
                <button class="mobile-filter-btn d-lg-none" id="filterToggleBtn">
                    <i class="bi bi-sliders"></i> Filters
                </button>
                <div class="row g-3 g-md-4" id="productGrid">
                    <!-- Loaded via JS -->
                </div>

                <template id="userProductTemplate">
                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="p-card-anchor-wrap">
                            <a href="" class="p-card-link text-decoration-none text-reset">
                                <div class="p-card">
                                    <div class="p-card-img">
                                        <span class="p-badge p-badge-dark d-none">New</span>
                                        <img src="" alt="">
                                        <div class="p-card-actions">
                                            <button type="button" class="p-action-btn wishlist-btn" title="Add to Wishlist"><i class="bi bi-heart"></i></button>
                                            <button type="button" class="p-action-btn cart-btn" title="Add to Cart"><i class="bi bi-cart3"></i></button>
                                        </div>
                                    </div>
                                    <div class="p-card-body">
                                        <div class="p-cat"></div>
                                        <h4 class="p-name"></h4>
                                        <div class="p-rating"></div>
                                        <div class="p-price"></div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Mobile filter overlay -->
    <div class="filter-overlay" id="filterOverlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common/auth-guard.js"></script>
    <script src="/js/product/products.js"></script>
</body>
</html>
